<svg xmlns="http://www.w3.org/2000/svg" width="980" height="556" viewBox="0 0 980 556" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>The 158-launch inference chain of nvngx_dlssnr.dll 310.8.0.0 at 1080p, reproduced byte for byte on the CPU by GlassBox-NR</title>
