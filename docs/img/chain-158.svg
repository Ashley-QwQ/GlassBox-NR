<path d="M 405 342 L 470 342 L 616 415" fill="none" stroke="#5b616b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="489" y="229" text-anchor="middle" font-size="11.5" fill="#57606a">skips (per resolution tier)</text>
<text x="470" y="334" text-anchor="middle" font-size="11.5" fill="#57606a">skip into the bridge</text>
<path d="M 865 88 L 865 72 L 290 72 L 290 86" fill="none" stroke="#c9772b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<path d="M 690 72 L 690 86" fill="none" stroke="#c9772b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="578" y="66" text-anchor="middle" font-size="11.5" fill="#c9772b">history texture carried to the next frame (read by B0 and B70)</text>
</g>
<text x="40" y="538" font-size="12" fill="#57606a">Arithmetic inside: FP8 E4M3 and FP16 matrix products with the GPU's own accumulation order, flush-to-zero, and table-exact special functions (RCP / RSQ / EX2 / LG2).</text>
</svg>