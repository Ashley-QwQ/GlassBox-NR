<text x="690.0" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Temporal (B70)</text>
<text x="690.0" y="130" text-anchor="middle" font-size="12" fill="#57606a">L155 · B70</text>
<text x="690.0" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#c9772b">1 launch</text>
<rect x="790" y="90" width="150" height="74" rx="9" fill="#8a8f98" fill-opacity="0.13" stroke="#8a8f98" stroke-width="1.6"/>
<text x="865.0" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Output</text>
